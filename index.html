<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PID 편심봉 시뮬레이션</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <canvas id="simCanvas" width="400" height="400"></canvas>
        
        <div class="controls">
            <div class="control-group">
                <label>목표 각도 (Target): <span id="targetVal">0</span>°</label>
                <input type="range" id="target" min="-90" max="90" value="0">
            </div>
            <div class="control-group">
                <label>P (비례) Kp: <span id="kpVal">2.0</span></label>
                <input type="range" id="kp" min="0" max="20" step="0.1" value="2.0">
            </div>
            <div class="control-group">
                <label>I (적분) Ki: <span id="kiVal">0.01</span></label>
                <input type="range" id="ki" min="0" max="1" step="0.01" value="0.01">
            </div>
            <div class="control-group">
                <label>D (미분) Kd: <span id="kdVal">5.0</span></label>
                <input type="range" id="kd" min="0" max="20" step="0.1" value="5.0">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
