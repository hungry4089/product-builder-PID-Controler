<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PID Controller Study — 모터 편심봉 시뮬레이션</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>PID Controller Study — 모터 편심봉 시뮬레이션</h1>
    </header>

    <main class="dashboard" data-mode="manual">
        <div class="top-row">
            <section class="card sim-section">
                <div class="card-header">모터/진자 시뮬레이션</div>
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="simCanvas" width="500" height="400"></canvas>
                </div>
                <div class="status-bar">
                    <div class="status-item">각도: <span id="statAngle">0.0</span>°</div>
                    <div class="status-item">각속도: <span id="statVel">0.0</span>°/s</div>
                    <div class="status-item">전압: <span id="statVolt">0.00</span>V</div>
                </div>
            </section>

            <section class="card control-section">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="manual">수동 제어</button>
                    <button class="tab-btn" data-tab="pid">PID 제어</button>
                </div>
                
                <div id="manual-controls" class="tab-content">
                    <h3>수동 모드 — 전압 인가</h3>
                    <div class="control-group">
                        <label>인가 전압 <span><span id="manualVoltVal">0.0</span>V</span></label>
                        <input type="range" id="manualVolt" min="-12" max="12" step="0.1" value="0">
                    </div>
                </div>

                <div id="pid-controls" class="tab-content">
                    <h3>PID 자동 제어 모드</h3>
                    <div class="control-group">
                        <label>목표 각도 <span><span id="targetVal">0</span>°</span></label>
                        <input type="range" id="target" min="-180" max="180" value="0">
                    </div>
                    <div class="control-group">
                        <label>Kp (비례) <span><span id="kpVal">0.0</span></span></label>
                        <input type="range" id="kp" min="0" max="200" step="1" value="0">
                    </div>
                    <div class="control-group">
                        <label>Ki (적분) <span><span id="kiVal">0.0</span></span></label>
                        <input type="range" id="ki" min="0" max="50" step="0.1" value="0">
                    </div>
                    <div class="control-group">
                        <label>Kd (미분) <span><span id="kdVal">0.0</span></span></label>
                        <input type="range" id="kd" min="0" max="50" step="0.1" value="0">
                    </div>
                </div>

                <div class="action-btns">
                    <button id="resetSim" class="btn-reset">리셋</button>
                    <button id="pauseSim" class="btn-pause">일시정지</button>
                </div>

                <div class="pid-guide">
                    <div class="guide-item"><strong>P (비례):</strong> 목표 각도에 빠르게 도달 (현재 오차)</div>
                    <div class="guide-item"><strong>I (적분):</strong> 잔류 편차 제거 및 정확도 향상 (과거 오차)</div>
                    <div class="guide-item"><strong>D (미분):</strong> 급격한 변화 억제 및 진동 감소 (미래 오차)</div>
                </div>
            </section>
        </div>

        <div class="graph-grid">
            <div class="card graph-card">
                <div class="graph-label">각도 [±180° | 적응형]</div>
                <div class="split-container">
                    <div class="chart-wrap"><canvas id="chartAngleFixed"></canvas></div>
                    <div class="chart-wrap"><canvas id="chartAngleDynamic"></canvas></div>
                </div>
            </div>
            <div class="card graph-card">
                <div class="graph-label">오차 [±180° | 적응형]</div>
                <div class="split-container">
                    <div class="chart-wrap"><canvas id="chartErrorFixed"></canvas></div>
                    <div class="chart-wrap"><canvas id="chartErrorDynamic"></canvas></div>
                </div>
            </div>
            <div class="card graph-card">
                <div class="graph-label">인가 토크 [±25Nm | 적응형]</div>
                <div class="split-container">
                    <div class="chart-wrap"><canvas id="chartVoltFixed"></canvas></div>
                    <div class="chart-wrap"><canvas id="chartVoltDynamic"></canvas></div>
                </div>
            </div>
            <div class="card graph-card">
                <div class="graph-label">PID 성분 [±15 | 적응형]</div>
                <div class="split-container">
                    <div class="chart-wrap"><canvas id="chartPIDFixed"></canvas></div>
                    <div class="chart-wrap"><canvas id="chartPIDDynamic"></canvas></div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
